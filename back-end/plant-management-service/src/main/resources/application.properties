# SmartGarden – plant-management-service
spring.application.name=plant-management-service
server.port=8082

# PostgreSQL / JPA
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:smartgarden}
#spring.datasource.url=jdbc:postgresql://localhost:5432/smartgarden
spring.datasource.username=${DB_USER:smartgarden}
spring.datasource.password=${DB_PASS:smartgarden}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq-broker}
#spring.rabbitmq.host=localhost
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASS:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}

# AMQP – Exchange, filas e routing keys
amqp.exchange=smartgarden.exchange

amqp.queue.plant-request=smartgarden.plant.request.queue
amqp.queue.plant-response=smartgarden.plant.response.queue
amqp.queue.reading=smartgarden.reading.queue
amqp.queue.alert=smartgarden.alert.queue

amqp.routing-key.plant-request=plant.request
amqp.routing-key.plant-response=plant.response
amqp.routing-key.reading-ingest=reading.ingest
amqp.routing-key.alert-response=alert.response

# Open PlantBook API
plantbook.api.base-url=https://open.plantbook.io/api/v1
plantbook.api.token=${PLANTBOOK_TOKEN:}
plantbook.api.search-limit=10

# Regras de irrigação (Usados como fallback quando a planta não tem care configurado)
irrigation.default-min-soil-moisture=30.0
irrigation.default-max-soil-moisture=70.0
irrigation.alert-threshold-offset=5.0

# Jackson
#spring.jackson.serialization.write-dates-as-timestamps=false
#spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false
#spring.jackson.deserialization.fail-on-unknown-properties=false
#spring.jackson.default-property-inclusion=NON_NULL

# Actuator – healthcheck para Docker Compose
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.rabbit.enabled=false

# Logging
logging.level.com.smartgarden=DEBUG
logging.level.org.springframework.amqp=INFO
logging.level.org.hibernate.SQL=INFO
