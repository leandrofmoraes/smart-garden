# ==============================================================
# SmartGarden – integration-service
# ==============================================================

spring.application.name=integration-service
server.port=8081

# ==============================================================
# RabbitMQ
# Credenciais configuradas via variáveis de ambiente no Docker Compose
# ==============================================================
spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq-broker}
#spring.rabbitmq.host=localhost
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASS:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}

# ==============================================================
# AMQP – Exchange, filas e routing keys
# ==============================================================
amqp.exchange=smartgarden.exchange

amqp.routing-key.plant-request=plant.request
amqp.routing-key.plant-response=plant.response
amqp.routing-key.reading-ingest=reading.ingest
amqp.routing-key.alert-response=alert.response

amqp.queue.plant-request=smartgarden.plant.request.queue
amqp.queue.plant-response=smartgarden.plant.response.queue
amqp.queue.reading=smartgarden.reading.queue
amqp.queue.alert=smartgarden.alert.queue

# Tempo máximo de espera pela resposta AMQP (padrão correlationId + CompletableFuture)
amqp.reply.timeout-ms=10000

# ==============================================================
# MQTT
# Credenciais opcionais – omitir valor se o broker não exigir autenticação
# ==============================================================
mqtt.broker.url=tcp://${MQTT_HOST:mqtt-broker}:${MQTT_PORT:1883}
#mqtt.broker.url=tcp://localhost:1883
mqtt.client.id=integration-service-${random.uuid}
mqtt.username=${MQTT_USER:}
mqtt.password=${MQTT_PASS:}
mqtt.clean-session=true
mqtt.connection-timeout=10
mqtt.keep-alive-interval=60
mqtt.qos=1

# Tópicos subscritos (+ = wildcard de nível único)
mqtt.topic.subscribe.readings=smartgarden/devices/+/reading
mqtt.topic.subscribe.status=smartgarden/devices/+/status
mqtt.topic.subscribe.telemetry=smartgarden/devices/+/telemetry

# Templates de publicação (%s = deviceId)
mqtt.topic.publish.command=smartgarden/devices/%s/command
mqtt.topic.publish.config=smartgarden/devices/%s/config

# ==============================================================
# Jackson
# ==============================================================
#spring.jackson.serialization.write-dates-as-timestamps=false
#spring.jackson.deserialization.fail-on-unknown-properties=false
#spring.jackson.default-property-inclusion=NON_NULL

# ==============================================================
# Actuator – healthcheck para Docker Compose
# ==============================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
# Evita falha no /actuator/health enquanto o RabbitMQ ainda está subindo
management.health.rabbit.enabled=false

# ==============================================================
# Logging
# ==============================================================
logging.level.com.smartgarden=DEBUG
logging.level.org.springframework.amqp=INFO
logging.level.org.springframework.integration=INFO
